# ─── FlowStudio · فاز ۰ روی سرورِ وبکستینگ (62.220.123.55) ───
# فقط وب. هیچ دیتابیس/ردیس/مینیویی هنوز لازم نیست — چون هنوز هیچ حالتی
# ذخیره نمی‌شود جز سرنخ‌های فرمِ تماس.
#
# اجرا روی سرور:
#   cd /opt/flowstudio && docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# ⚠️ این پروژه مستقل است: هرگز روی کانتینرها یا شبکهٔ webcasting دست نمی‌زند.
# nginx سرور (بیرون از این compose) روی پورتِ 3100 پروکسی می‌کند.

services:
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: flowstudio_web
    restart: unless-stopped
    # 172.18.0.1 = گیت‌ویِ شبکهٔ wbc_wbc روی هاست. nginxِ وبکستینگ کانتینر است،
    # نه سرویسِ هاست؛ پس 127.0.0.1 برایش خودش می‌شود و ما را نمی‌بیند.
    # از این آدرس ما را می‌بیند، ولی از بیرونِ سرور قابلِ دسترس نیست.
    # عمداً به شبکهٔ wbc_wbc نمی‌پیوندیم — پروژه مستقل می‌ماند.
    # ⚠️ اگر شبکهٔ wbc_wbc بازساخته شد، ساب‌نت را دوباره بگیر:
    #   docker network inspect wbc_wbc --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}'
    ports:
      - "172.18.0.1:3100:3100"
    environment:
      NODE_ENV: production
      FLOWSTUDIO_LEADS_FILE: /data/leads.jsonl
    volumes:
      - fs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  fs_data:
