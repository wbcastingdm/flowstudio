# ─── backlot.flowstudio.ir — بلوکِ nginx ───
#
# ⚠️ همان تلهٔ همیشگی: روی این سرور nginx یک **کانتینر** است (`wbc_nginx`)، نه
#    سرویسِ هاست، و کلِ کانفیگش یک فایلِ واحدِ read-only است:
#      هاست: /opt/webcasting-platform/deploy/turkey/nginx.conf
#      داخل: /etc/nginx/conf.d/default.conf
#    گذاشتنِ فایلِ جدا در `conf.d` **هیچ اثری ندارد**. محتوای زیر باید به
#    **انتهای** آن فایل اضافه شود. این نسخه فقط مرجعِ نسخه‌بندی‌شده است.
#
# توالیِ امن:
#   ۱) بکاپ:  cp nginx.conf nginx.conf.bak-backlot-$(date +%s)
#   ۲) افزودنِ بلوکِ زیر به انتهای فایل
#   ۳) docker exec wbc_nginx nginx -t         ← خطا داد؟ بکاپ را برگردان
#   ۴) docker exec wbc_nginx nginx -s reload  ← بدونِ این هیچ اثری ندارد
#
# پیش‌نیازها:
#   • رکوردِ A: backlot.flowstudio.ir → 62.220.123.55   (فقط مالک می‌سازد)
#   • فایلِ رمز:
#       docker exec wbc_nginx sh -c \
#         'printf "%s:%s\n" backlot "$(openssl passwd -apr1 <رمز>)" \
#          > /etc/nginx/.htpasswd-backlot'
#   • گواهی (اول بلوکِ پورتِ ۸۰ فعال باشد تا چالشِ acme جواب بدهد):
#       docker run --rm -v /etc/letsencrypt:/etc/letsencrypt \
#         -v wbc_wbc_certbot:/var/www/certbot certbot/certbot certonly \
#         --webroot -w /var/www/certbot -d backlot.flowstudio.ir \
#         --agree-tos -n -m postmaster@webcasting.ir
#
# 🔴 تلهٔ کلادفلر: اگر رکورد **پروکسی‌شده (ابرِ نارنجی)** باشد و SSL روی Full،
#    کلادفلر با HTTPS به مبدأ وصل می‌شود ⇒ تا گواهی روی ۴۴۳ نباشد **۵۲۱** می‌دهد،
#    در حالی که `http` سالم ۲۰۰ می‌دهد و گمراهت می‌کند.
#    ⇒ رکورد را اول **DNS only (ابرِ خاکستری)** بساز، گواهی را بگیر، بعد پروکسی کن.

server {
    listen 80; listen [::]:80;
    server_name backlot.flowstudio.ir;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name backlot.flowstudio.ir;

    ssl_certificate     /etc/letsencrypt/live/backlot.flowstudio.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backlot.flowstudio.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # 🔒 بردِ OpenMontage **هیچ احرازِ هویتی ندارد** — خودِ مستندش می‌گوید
    #    «read-only local board». آرتیفکت و مدیای پروژه‌ها را بی‌قید نشان می‌دهد.
    #    پس دروازه این‌جاست، نه در خودِ اپ.
    auth_basic           "Backlot";
    auth_basic_user_file /etc/nginx/.htpasswd-backlot;

    # این چیز محصول نیست؛ هیچ موتورِ جست‌وجویی نباید ببیندش.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        auth_basic off;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://172.18.0.1:4750;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🔴 بردْ زنده‌بودنش را با SSE نگه می‌دارد (`/api/project/<id>/events`).
    #    بدونِ خاموش‌کردنِ بافر، nginx جریان را نگه می‌دارد و برد یخ می‌زند —
    #    بی‌هیچ خطایی، فقط هیچ‌وقت به‌روز نمی‌شود.
    location ~ ^/api/(project/[^/]+/events|library/events)$ {
        proxy_pass http://172.18.0.1:4750;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }
}
