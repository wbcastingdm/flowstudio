# ─── flowstudio.ir — دامنهٔ مستقل ───
#
# ⚠️ پیش‌نیازِ حتمی (فقط مالک می‌تواند): دامنه هنوز NS ندارد.
#    ۱) در پنلِ ثبت‌کننده، نیم‌سرورها را به Cloudflare بده
#    ۲) در Cloudflare رکوردِ A بساز: flowstudio.ir → 62.220.123.55
#       و همچنین www.flowstudio.ir → 62.220.123.55
#    تا این انجام نشود، هیچ‌چیز روی این دامنه بالا نمی‌آید.
#
# ⚠️ nginx روی این سرور **کانتینر** است (wbc_nginx) و کلِ کانفیگش یک فایلِ
#    واحدِ read-only است. فایلِ جدا در conf.d **هیچ اثری ندارد** — محتوای
#    زیر باید به انتهای این فایل اضافه شود:
#      /opt/webcasting-platform/deploy/turkey/nginx.conf
#    سپس: docker exec wbc_nginx nginx -t && docker exec wbc_nginx nginx -s reload
#
# گواهی (بعد از فعال‌شدنِ بلوکِ پورتِ ۸۰):
#   docker run --rm -v /etc/letsencrypt:/etc/letsencrypt \
#     -v wbc_wbc_certbot:/var/www/certbot certbot/certbot certonly \
#     --webroot -w /var/www/certbot -d flowstudio.ir -d www.flowstudio.ir \
#     --agree-tos -n -m postmaster@webcasting.ir

server {
    listen 80; listen [::]:80;
    server_name flowstudio.ir www.flowstudio.ir;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://flowstudio.ir$request_uri; }
}

server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name www.flowstudio.ir;
    ssl_certificate     /etc/letsencrypt/live/flowstudio.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowstudio.ir/privkey.pem;
    return 301 https://flowstudio.ir$request_uri;
}

server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name flowstudio.ir;

    ssl_certificate     /etc/letsencrypt/live/flowstudio.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowstudio.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    client_max_body_size 200M;

    # تا وقتی محصول واقعاً کار نکند، ایندکس نشود.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ⚠️ 172.18.0.1 گیت‌ویِ شبکهٔ wbc_wbc روی هاست است؛ 127.0.0.1 از داخلِ
    # کانتینرِ nginx خودِ nginx می‌شود و کانتینرهای ما را نمی‌بیند.

    # APIِ FlowStudio — same-origin، پس پنلِ ادمین به CORS نیاز ندارد.
    location /api/ {
        proxy_pass http://172.18.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://172.18.0.1:3200/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://172.18.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
