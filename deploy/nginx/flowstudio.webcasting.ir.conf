# ─── flowstudio.webcasting.ir — بلوکِ nginx ───
#
# ⚠️ روی سرورِ وبکستینگ nginx یک **کانتینر** است (wbc_nginx)، نه سرویسِ هاست،
#    و کلِ کانفیگش یک فایلِ واحد است که read-only مانت شده:
#      هاست: /opt/webcasting-platform/deploy/turkey/nginx.conf
#      داخل: /etc/nginx/conf.d/default.conf
#    پس این فایل جداگانه مانت نمی‌شود — محتوایش باید به **انتهای** آن فایل
#    اضافه شود. این نسخه فقط مرجعِ نسخه‌بندی‌شدهٔ همان بلوک است.
#
# توالیِ امن:
#   ۱) بکاپ:  cp nginx.conf nginx.conf.bak-$(date +%s)
#   ۲) افزودنِ بلوکِ زیر به انتهای فایل
#   ۳) docker exec wbc_nginx nginx -t         ← اگر خطا داد، بکاپ را برگردان
#   ۴) docker exec wbc_nginx nginx -s reload  ← بدونِ این هیچ اثری ندارد
#
# پیش‌نیازها:
#   • رکوردِ A برای flowstudio.webcasting.ir → 62.220.123.55 در Cloudflare
#   • گواهی: با همان روشِ بقیهٔ زیردامنه‌ها (webroot در والیومِ wbc_wbc_certbot)
#       docker run --rm -v /etc/letsencrypt:/etc/letsencrypt \
#         -v wbc_wbc_certbot:/var/www/certbot certbot/certbot certonly \
#         --webroot -w /var/www/certbot -d flowstudio.webcasting.ir \
#         --agree-tos -n -m postmaster@webcasting.ir
#     (اول باید بلوکِ پورتِ ۸۰ فعال باشد تا چالشِ acme جواب بدهد)

# ── flowstudio.webcasting.ir (پروژهٔ مستقلِ FlowStudio، هم‌خانه روی همین سرور) ──
server {
    listen 80; listen [::]:80;
    server_name flowstudio.webcasting.ir;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name flowstudio.webcasting.ir;
    ssl_certificate     /etc/letsencrypt/live/flowstudio.webcasting.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowstudio.webcasting.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    client_max_body_size 200M;

    # تا پیش از راه‌اندازیِ رسمی هیچ موتورِ جست‌وجویی این را ایندکس نکند.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ⚠️ 172.18.0.1 گیت‌ویِ شبکهٔ wbc_wbc روی هاست است. کانتینرِ flowstudio_web
    # عمداً به این شبکه نپیوسته و فقط روی همین آدرس پورتِ ۳۱۰۰ را باز کرده.
    location / {
        proxy_pass http://172.18.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
