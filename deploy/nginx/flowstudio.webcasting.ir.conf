# ─── flowstudio.webcasting.ir — پروژهٔ مستقلِ FlowStudio روی سرورِ وبکستینگ ───
# جای فایل روی سرور: /etc/nginx/conf.d/ (یا هرجا که conf.d وبکستینگ خوانده می‌شود)
#
# پیش‌نیاز:
#   ۱) رکوردِ DNS ای برای flowstudio.webcasting.ir به 62.220.123.55
#   ۲) گواهی: certbot --nginx -d flowstudio.webcasting.ir
#      (یا اگر گواهیِ wildcard وبکستینگ هست، همان مسیر را بگذارید)
#
# ⚠️ بعد از افزودن: nginx -t && nginx -s reload  — بدونِ reload هیچ اثری ندارد.

server {
    listen 80;
    server_name flowstudio.webcasting.ir;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name flowstudio.webcasting.ir;

    ssl_certificate     /etc/letsencrypt/live/flowstudio.webcasting.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowstudio.webcasting.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 200M;

    # تا پیش از راه‌اندازیِ رسمی، هیچ موتورِ جست‌وجویی این را ایندکس نکند.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
